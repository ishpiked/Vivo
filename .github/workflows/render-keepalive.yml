name: Keep Render service warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Render health endpoint
        env:
          RENDER_HEALTH_URL: https://kitsu-backend-2mbi.onrender.com
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_HEALTH_URL}" ]]; then
            echo "Configure this workflow with the Render service base URL."
            exit 1
          fi
          url="${RENDER_HEALTH_URL%/}/health"
          for attempt in 1 2 3; do
            echo "probe_attempt=${attempt} timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            response="$(curl --silent --show-error --max-time 120 \
              --write-out $'\n%{http_code}' "${url}")" || response=""
            status="${response##*$'\n'}"
            body="${response%$'\n'*}"
            echo "http_status=${status:-request_failed}"
            if [[ "${status}" == "200" ]] \
              && grep -Eq '"status"[[:space:]]*:[[:space:]]*"healthy"' <<< "${body}"; then
              echo "api_health=healthy"
              servers_response="$(curl --silent --show-error --max-time 30 \
                --write-out $'\n%{http_code}' \
                "${RENDER_HEALTH_URL%/}/api/servers")" || servers_response=""
              servers_status="${servers_response##*$'\n'}"
              servers_body="${servers_response%$'\n'*}"
              if [[ "${servers_status}" == "200" ]] \
                && jq -e '[.result.servers[].server] | index("Aster") != null and index("Vexa") != null' \
                  <<< "${servers_body}" >/dev/null; then
                echo "server_profiles=Aster,Vexa"
                exit 0
              fi
              echo "The API is healthy, but Aster/Vexa profiles were not returned."
              exit 1
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep 10
            fi
          done
          echo "Render health endpoint did not return the expected healthy response."
          exit 1
